org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

neo_version=21.1.248
minecraft_version=1.21.1

# Required parent mod - the addon does nothing without it.
botanypots_version=21.1.44
bookshelf_version=21.1.81

# compileOnly versions for the optional parent-mod integrations (BotanyPotsTiers, PowerPots,
# DimStorage+EdivadLib) - see the "dependencies" block in build.gradle. None of these are bundled
# or required; they only need to exist for compilation and for the dev client run to have
# something to load. Values are Modrinth *version ids*, not version numbers.
botanypotstiers_version=9jLH4F79
powerpots_version=ramD6kYl
dimstorage_version=R7rQFgQh
edivadlib_version=exl6hgWJ
jade_version=eYz2YBGT

mod_id=botanygardens
mod_name=Botany Gardens
mod_version=0.2.1
mod_group_id=dev.mikey.botanygardens
mod_license=MIT
mod_authors=mikey

# This machine has AAAA records for the Maven hosts but no working IPv6 route, so the
# JVM stalls on connect until it falls back. Force IPv4 and be patient with slow mirrors.
systemProp.java.net.preferIPv4Stack=true
org.gradle.internal.http.connectionTimeout=60000
org.gradle.internal.http.socketTimeout=60000
